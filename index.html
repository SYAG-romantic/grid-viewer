<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>图层查看</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/ol@10/ol.css">
<link rel="stylesheet" href="styles.css?v=r2">
</head>
<body>
<div id="app" class="panelopen">

  <aside id="panel">
    <div id="brand">
      <span class="dot"></span>
      <h1>图层查看</h1>
      <button id="btnTk" class="tk-status" title="天地图密钥设置">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="3.2"/>
          <path d="M19 13.5v1.2a1 1 0 0 1-.7.95l-1.5.45-.8 1.4.7 1.4a1 1 0 0 1-.2 1.15l-.9.9a1 1 0 0 1-1.15.2l-1.4-.7-1.4.8-.45 1.5a1 1 0 0 1-.95.7h-1.2a1 1 0 0 1-.95-.7l-.45-1.5-1.4-.8-1.4.7a1 1 0 0 1-1.15-.2l-.9-.9a1 1 0 0 1-.2-1.15l.7-1.4-.8-1.4-.45-1.5a1 1 0 0 1 .7-.95h1.2l1.5-.45.8-1.4-.7-1.4a1 1 0 0 1 .2-1.15l.9-.9a1 1 0 0 1 1.15-.2l1.4.7 1.4-.8.45-1.5a1 1 0 0 1 .95-.7h.9"/>
        </svg>
      </button>
    </div>

    <!-- 天地图密钥设置弹窗（点击顶部状态按钮打开） -->
    <div id="tkPop" class="tk-pop">
      <div class="rsz rsz-n" data-dir="n"></div><div class="rsz rsz-s" data-dir="s"></div>
      <div class="rsz rsz-w" data-dir="w"></div><div class="rsz rsz-e" data-dir="e"></div>
      <div class="rsz rsz-nw" data-dir="nw"></div><div class="rsz rsz-ne" data-dir="ne"></div>
      <div class="rsz rsz-sw" data-dir="sw"></div><div class="rsz rsz-se" data-dir="se"></div>
      <div class="tp-h"><b>天地图密钥</b><span class="tk-stat" id="tkStat"></span><button id="tkClose" title="关闭">×</button></div>
      <div class="tp-b">
        <div class="fld" style="margin-top:0">
          <span>添加 Key</span>
          <div class="ipt-wrap">
            <input type="password" id="tkInput" placeholder="输入天地图 key" autocomplete="off" spellcheck="false">
            <button type="button" class="eye" id="tkEye" title="显示 / 隐藏密钥" aria-label="显示或隐藏密钥">
              <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
                   stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
                <g class="open">
                  <path d="M2 12s3.7-6 10-6 10 6 10 6-3.7 6-10 6-10-6-10-6Z"/>
                  <circle cx="12" cy="12" r="2.6"/>
                </g>
                <g class="slash">
                  <path d="M2 12s3.7-6 10-6 10 6 10 6-3.7 6-10 6-10-6-10-6Z"/>
                  <circle cx="12" cy="12" r="2.6"/>
                  <path d="M4 20L20 4"/>
                </g>
              </svg>
            </button>
          </div>
        </div>
        <div class="mini" style="margin-bottom:9px">
          <button id="tkSave" class="pri" style="flex:1">保存</button>
          <button id="tkDel">删除</button>
        </div>
        <div class="fld">
          <span>选择 Key</span>
          <select id="tkSel"></select>
        </div>
      </div>
    </div>

    <div id="panelBody">

      <details open>
        <summary>数据图层</summary>
        <div class="sec">
          <div class="two" style="margin-bottom:7px">
            <button id="btnDir" class="pri">选择数据文件夹</button>
            <button id="btnFiles">选择文件</button>
          </div>
          <input type="file" id="pickDir" webkitdirectory directory multiple hidden>
          <input type="file" id="pickFiles" multiple hidden accept=".csv,.txt,.tsv,.json,.geojson,.xlsx,.xls,.tab,.dat,.map,.id,.shp,.shx,.dbf,.prj,.cpg,.kml,.mif,.mid">
          <div id="restoreBar" class="restore" style="display:none">
            <div class="restore-t">已记住数据源：<b id="srcName">—</b></div>
            <div class="mini">
              <button id="btnRestore" class="pri" style="flex:1">恢复数据</button>
              <button id="btnForget" title="清除记住的数据源">忘记</button>
              <button id="btnClearCache" title="删除本地数据缓存，当前页面数据不受影响" style="display:none">清除缓存</button>
            </div>
            <div class="restore-h" id="restoreHint">浏览器会弹出一次授权，点「允许」即可自动重新读取，无需再找文件夹。</div>
          </div>
          <div style="font-size:11.5px;color:var(--fg3);line-height:1.5">
            也可把文件直接拖到右侧地图。数据与边界文件可一起选，类型自动识别。
            文件名含「工参/小区/基站」按工参图层加载，含「栅格」按栅格图层加载，其余自动判别。
            边界图层：一次选中同名 .tab/.dat/.map/.id（MapInfo）或 .shp/.dbf/.prj（Shapefile），也支持 kml / geojson。
          </div>

<div id="layerList" style="margin-top:9px"></div>
        </div>
      </details>



    </div>
  </aside>

  <main id="mapwrap">
    <div id="map"></div>
    <canvas id="pts"></canvas>
    <canvas id="labelCanvas"></canvas>

    <div id="topbar">
      <button id="btnFold" class="panbtn" title="收起 / 展开左侧面板" aria-label="收起或展开左侧面板">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
          <path d="M15 5l-7 7 7 7"/>
        </svg>
      </button>
      <div id="searchBox" style="position:relative;display:flex;align-items:center;gap:6px;padding:0 2px">
        <div class="dsel" id="jumpTypeBox" style="flex:0 0 auto">
          <button type="button" id="jumpTypeBtn" class="dsel-btn" aria-haspopup="listbox" aria-expanded="false">
            <b id="jumpTypeCur">全部</b>
            <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dsel-pop" id="jumpTypePop" role="listbox" style="text-align:left">
            <div class="dsel-h">搜索类型</div>
            <button type="button" role="option" data-v="auto" style="justify-content:flex-start"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="9"/></svg><span>全部</span></button>
            <button type="button" role="option" data-v="ll" style="justify-content:flex-start"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 2v20M2 12h20"/><circle cx="12" cy="12" r="4"/></svg><span>经纬度</span></button>
            <button type="button" role="option" data-v="cgi" style="justify-content:flex-start"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M7 9h10M7 13h6"/></svg><span>CGI</span></button>
            <button type="button" role="option" data-v="cell" style="justify-content:flex-start"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18v-6a2 2 0 012-2h12a2 2 0 012 2v6"/><path d="M2 18h20"/></svg><span>小区名称</span></button>
            <button type="button" role="option" data-v="scene" style="justify-content:flex-start"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg><span>区域场景名称</span></button>
          </div>
        </div>
        <input type="hidden" id="jumpType" value="auto">
        <input type="text" id="jump" placeholder="" title="输入小区名、CGI 或经纬度" style="flex:1 1 auto;min-width:60px;height:32px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--glass);color:var(--fg);padding:0 8px;outline:none">
        <button id="btnJump" class="icon-btn" title="搜索">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button id="btnPinClear" class="icon-btn" title="清除地图上的定位标记">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
        </button>
        <div id="jumpResults" style="display:none;position:absolute;top:38px;left:0;right:0;max-height:320px;overflow:auto;background:var(--popbg);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border:1px solid var(--line);border-radius:8px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)"></div>
      </div>

      <div id="baseBox" class="dsel">
        <button type="button" id="baseBtn" class="dsel-btn" aria-haspopup="listbox" aria-expanded="false">
          <span>底图</span><b id="baseCur">影像</b>
          <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="dsel-pop" id="basePop" role="listbox">
          <div class="dsel-h">底图样式</div>
          <button type="button" role="option" data-v="img">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><rect x="3" y="3" width="18" height="18" rx="2"/><path d="M3 15l5-5 4 4 3-3 6 6"/><circle cx="8.5" cy="8.5" r="1.3"/></svg>
            <span>影像底图</span>
          </button>
          <button type="button" role="option" data-v="vec">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 4L3 6.5v13L9 17l6 2.5 6-2.5v-13L15 6.5 9 4z"/><path d="M9 4v13M15 6.5v13"/></svg>
            <span>矢量底图</span>
          </button>
          <button type="button" role="option" data-v="ter">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6.5-11 4 6.5L16 11l5 8z"/><path d="M10 5.5c.8-1 2.2-1 3 0"/></svg>
            <span>地形晕染</span>
          </button>
          <button type="button" role="option" data-v="none">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="8.5"/><path d="M6 6l12 12"/></svg>
            <span>无底图</span>
          </button>
        </div>
      </div>
      
      <div id="gmodeBox" class="dsel">
        <button type="button" id="gmodeBtn" class="dsel-btn" aria-haspopup="listbox" aria-expanded="false">
          <span>指标</span><b id="gmodeCur">RSRP</b>
          <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="dsel-pop" id="gmodePop" role="listbox">
          <div class="dsel-h">选择指标</div>
          <button type="button" role="option" data-v="rsrp">
            <i class="ramp" style="background:linear-gradient(90deg,#ff0000 0 16.6%,#f7a518 16.6% 33.3%,#edf038 33.3% 50%,#4ff380 50% 66.6%,#0cac0f 66.6% 83.3%,#002aff 83.3% 100%)"></i>
            <span>RSRP均值</span>
          </button>
          <button type="button" role="option" data-v="sinr">
            <i class="ramp" style="background:linear-gradient(90deg,#ff0000 0 14.3%,#ffa500 14.3% 28.6%,#ffff00 28.6% 42.9%,#00ffff 42.9% 57.2%,#0000ff 57.2% 71.5%,#00ff00 71.5% 85.8%,#008000 85.8% 100%)"></i>
            <span>SINR均值</span>
          </button>
          <button type="button" role="option" data-v="cov">
            <i class="ramp" style="background:linear-gradient(90deg,#ff0000 0 20%,#ffa500 20% 40%,#ffff00 40% 60%,#00ff00 60% 80%,#008000 80% 100%)"></i>
            <span>覆盖率</span>
          </button>
        </div>
      </div>

      <div id="ratBox" class="dsel">
        <button type="button" id="ratBtn" class="dsel-btn" aria-haspopup="listbox" aria-expanded="false">
          <span>制式</span><b id="ratCur">全部</b>
          <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="dsel-pop" id="ratPop" role="listbox">
          <div class="dsel-h">选择制式</div>
          <button type="button" role="option" data-rat="*"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:linear-gradient(135deg,#e74c3c 50%,#3498db 50%)"></span><span>全部</span></button>
          <button type="button" role="option" data-rat="4G"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:#e74c3c"></span><span>4G</span></button>
          <button type="button" role="option" data-rat="5G"><span style="display:inline-block;width:12px;height:12px;border-radius:50%;flex:0 0 12px;background:#3498db"></span><span>5G</span></button>
        </div>
      </div>
      <div id="cityBox" class="dsel">
        <button type="button" id="cityBtn" class="dsel-btn" aria-haspopup="listbox" aria-expanded="false">
          <span>地市</span><b id="cityCur">全部地市</b>
          <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor"
               stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round">
            <path d="M6 9l6 6 6-6"/>
          </svg>
        </button>
        <div class="dsel-pop" id="cityPop" role="listbox">
          <div class="dsel-h">选择地市</div>
          <button type="button" role="option" data-v="*">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M3 19l6.5-11 4 6.5L16 11l5 8z"/></svg>
            <span>全部地市</span>
          </button>
          <button type="button" role="option" data-v="6501">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>乌鲁木齐</span>
          </button>
          <button type="button" role="option" data-v="6502">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>克拉玛依</span>
          </button>
          <button type="button" role="option" data-v="6521">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>吐鲁番</span>
          </button>
          <button type="button" role="option" data-v="6522">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>哈密</span>
          </button>
          <button type="button" role="option" data-v="6523">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>昌吉</span>
          </button>
          <button type="button" role="option" data-v="6527">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>博州</span>
          </button>
          <button type="button" role="option" data-v="6528">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>巴州</span>
          </button>
          <button type="button" role="option" data-v="6529">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>阿克苏</span>
          </button>
          <button type="button" role="option" data-v="6530">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>克州</span>
          </button>
          <button type="button" role="option" data-v="6531">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>喀什</span>
          </button>
          <button type="button" role="option" data-v="6532">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>和田</span>
          </button>
          <button type="button" role="option" data-v="6540">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>伊犁</span>
          </button>
          <button type="button" role="option" data-v="6542">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>塔城</span>
          </button>
          <button type="button" role="option" data-v="6543">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>阿勒泰</span>
          </button>
          <button type="button" role="option" data-v="6590">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>奎屯</span>
          </button>
          <button type="button" role="option" data-v="6591">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 21V8l5-4v17"/><path d="M9 21V4l6 3v14"/><path d="M15 21v-8l5 2v6"/><path d="M2 21h20"/></svg>
            <span>石河子</span>
          </button>
        </div>
      </div>
      <div class="dsel" id="labelBox">
        <button type="button" id="btnLabel" class="toolbtn dsel-btn" aria-haspopup="listbox" aria-expanded="false" title="注记显示">
          <b>注记</b>
          <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
        </button>
        <div class="dsel-pop" id="labelPop" role="listbox">
          <div class="dsel-h">注记显示</div>
          <button type="button" role="option" data-v="4g"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18v-6a2 2 0 012-2h12a2 2 0 012 2v6"/><path d="M2 18h20"/></svg><span>4G小区名称</span></button>
          <button type="button" role="option" data-v="5g"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M4 18v-6a2 2 0 012-2h12a2 2 0 012 2v6"/><path d="M2 18h20"/></svg><span>5G小区名称</span></button>
          <button type="button" role="option" data-v="scene"><svg viewBox="0 0 24 24" width="14" height="14" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 7l9-4 9 4-9 4-9-4z"/><path d="M3 7v10l9 4 9-4V7"/></svg><span>区域场景名称</span></button>
        </div>
      </div>
      <div class="dsel" id="bandBox">
        <button type="button" id="btnBand" class="toolbtn dsel-btn" title="按频段样式：扇区的颜色/半径/波束角按频段表切换（开/关）"><b>频段</b></button>
      </div>
      <div id="statsBox" style="position:relative" title="场景指标统计：选图层 → 搜场景查询 → 导出">
        <div class="dsel" id="stLayerBox" style="flex:0 0 auto">
          <button type="button" id="stLayerBtn" class="dsel-btn" aria-haspopup="listbox" aria-expanded="false" title="选择边界图层">
            <b id="stLayerCur">统计</b>
            <svg class="chev" viewBox="0 0 24 24" width="11" height="11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M6 9l6 6 6-6"/></svg>
          </button>
          <div class="dsel-pop" id="stLayerPop" role="listbox" style="text-align:left"></div>
        </div>
        <input type="text" id="stSearch" placeholder="" title="输入区域场景名称后点查询" autocomplete="off"
               style="flex:1 1 auto;min-width:48px;max-width:110px;height:30px;font-size:12px;border:1px solid var(--line);border-radius:8px;background:var(--glass);color:var(--fg);padding:0 8px;outline:none">
        <button id="stQuery" class="icon-btn" title="查询场景并统计">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="8"/><path d="M21 21l-4.35-4.35"/></svg>
        </button>
        <button id="stClear" class="icon-btn" title="清除选中场景（导出将导全部）">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M3 6h18M8 6V4a2 2 0 012-2h4a2 2 0 012 2v2m3 0v14a2 2 0 01-2 2H7a2 2 0 01-2-2V6"/></svg>
        </button>
        <button id="stExport" class="icon-btn" title="导出：统计选中场景→该场景指标；地图上有框选→选区内小区；都没有→全部场景指标">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3v12m0 0l-4-4m4 4l4-4"/><path d="M4 17v2a2 2 0 002 2h12a2 2 0 002-2v-2"/></svg>
        </button>
        <div id="stList" style="display:none;position:absolute;top:38px;left:0;right:0;max-height:320px;overflow:auto;background:var(--popbg);backdrop-filter:blur(10px) saturate(1.3);-webkit-backdrop-filter:blur(10px) saturate(1.3);border:1px solid var(--line);border-radius:8px;z-index:20;box-shadow:0 8px 24px rgba(0,0,0,.3)"></div>
      </div>
      <button id="btnTheme" class="themebtn" title="切换深色 / 浅色">
        <svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor"
             stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
          <g class="ic-sun">
            <circle cx="12" cy="12" r="4.2"/>
            <path d="M12 2.2v2.3M12 19.5v2.3M2.2 12h2.3M19.5 12h2.3M5 5l1.7 1.7M17.3 17.3L19 19M19 5l-1.7 1.7M6.7 17.3L5 19"/>
          </g>
          <g class="ic-moon">
            <path d="M20.6 14.4A8.6 8.6 0 1 1 9.6 3.4a7 7 0 0 0 11 11Z"/>
          </g>
        </svg>
      </button>
    </div>

    <div id="legend" class="fold">
      <header id="legendHead" title="按住可拖动，单击折叠 / 展开">
        <span class="t"><span id="legendTitle">RSRP值</span> <span id="legendSub" class="sub"></span></span>
        <button id="legendReset" class="lvbtn" title="重置位置与大小">
          <svg viewBox="0 0 24 24" width="12" height="12" fill="none" stroke="currentColor"
               stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3 12a9 9 0 1 0 3-6.7"/><path d="M3 4v5h5"/>
          </svg>
        </button>
      </header>
      <div class="body" id="legendBody"></div>
    </div>


    <div id="toolStrip">
      <div class="tgroup" id="grpMeasure">
        <button id="btnMeasure" class="tbtn" title="测量：测量线 / 面积 / 方位角 / 角度">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <rect x="1.8" y="8" width="20.4" height="8" rx="2"/>
            <path d="M6 8v3M10 8v4M14 8v3M18 8v4"/>
          </svg>
          <i class="tcar"></i>
        </button>
        <div class="tfly" id="flyMeasure">
          <button data-tool="line">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M5 19L19 5"/><circle cx="5" cy="19" r="2"/><circle cx="19" cy="5" r="2"/></svg>
            <span>测量线</span>
          </button>
          <button data-tool="area">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M4 6l8-3 8 3v8l-8 7-8-7z"/></svg>
            <span>测量面积</span>
          </button>
          <button data-tool="azimuth">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8"/><path d="M12 4v4M12 16v4"/><path d="M12 12l4-4"/></svg>
            <span>测量方位角</span>
          </button>
          <button data-tool="angle">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 20L12 5l8 15"/><path d="M4 20h16"/></svg>
            <span>测量角度</span>
          </button>
        </div>
      </div>

      <div class="tgroup" id="grpSelect">
        <button id="btnSelect" class="tbtn" title="选择：矩形 / 多边形 / 自由手绘 / 半径">
          <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
               stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
            <path d="M3.2 8.4V5.4a2.2 2.2 0 0 1 2.2-2.2h3M15.6 3.2h3a2.2 2.2 0 0 1 2.2 2.2v3M20.8 15.6v3a2.2 2.2 0 0 1-2.2 2.2h-3M8.4 20.8h-3a2.2 2.2 0 0 1-2.2-2.2v-3"/>
            <circle cx="12" cy="12" r="3.1" stroke-dasharray="2.6 2.2"/>
          </svg>
          <i class="tcar"></i>
        </button>
        <div class="tfly" id="flySelect">
          <button data-tool="rect">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="4" y="5" width="16" height="14" rx="1.5" stroke-dasharray="3 2.4"/></svg>
            <span>矩形框选</span>
          </button>
          <button data-tool="poly">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linejoin="round"><path d="M12 3l8 6-3 11H7L4 9z" stroke-dasharray="3 2.4"/></svg>
            <span>按多边形选择</span>
          </button>
          <button data-tool="free">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 16c2-7 5-10 8-10s5 4 4 8-3 6-6 6c-2 0-4-2-6-4z" stroke-dasharray="3 2.4"/></svg>
            <span>自由手绘选择</span>
          </button>
          <button data-tool="radius">
            <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="8" stroke-dasharray="3 2.4"/><circle cx="12" cy="12" r="1.4"/><path d="M12 12l6-6"/></svg>
            <span>按半径选择</span>
          </button>
        </div>
      </div>

      <button id="btnCoord" class="tbtn" title="经纬度拾取：在地图上点击即可读取该点经纬度">
        <svg viewBox="0 0 24 24" width="17" height="17" fill="none" stroke="currentColor"
             stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
          <circle cx="12" cy="12" r="6.4"/>
          <path d="M12 2.4v4.1M12 17.5v4.1M2.4 12h4.1M17.5 12h4.1"/>
          <circle cx="12" cy="12" r="1.5" fill="currentColor" stroke="none"/>
        </svg>
      </button>
    </div>

    <div id="toolPanel">
      <div class="tp-h"><b id="tpTitle">测量</b><button id="tpClose" class="lvbtn" title="清除结果并退出工具">✕</button></div>
      <div class="tp-b" id="tpBody"></div>
    </div>

    <div id="popup">
      <div class="rsz rsz-n" data-dir="n"></div><div class="rsz rsz-s" data-dir="s"></div>
      <div class="rsz rsz-w" data-dir="w"></div><div class="rsz rsz-e" data-dir="e"></div>
      <div class="rsz rsz-nw" data-dir="nw"></div><div class="rsz rsz-ne" data-dir="ne"></div>
      <div class="rsz rsz-sw" data-dir="sw"></div><div class="rsz rsz-se" data-dir="se"></div>
      <div class="ph">
        <div class="pt"><b id="popTitle">要素</b><span class="sub" id="popSub"></span></div>
        <button id="popClose" title="关闭">×</button>
      </div>
      <div class="pb"><table id="popTable"></table></div>
      <div class="pfoot" id="popFoot" style="display:none"></div>
    </div>

    <div id="err"><span id="errMsg"></span><button id="errX" title="关闭" aria-label="关闭">✕</button></div>

    <div id="busy" class="hide">
      <div class="card">
        <div class="t" id="busyT">正在解析数据…</div>
        <div class="bar"><i id="busyBar"></i></div>
        <div class="s" id="busyS"></div>
      </div>
    </div>
  </main>

</div>

<script src="https://cdn.jsdelivr.net/npm/ol@10/dist/ol.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
<script src="data.js?v=1021o"></script>
<script src="vector.js?v=1021o"></script>
<script src="view.js?v=1021o"></script>
<script src="app.js?v=1021o"></script>
</body>
</html>
